# 프로젝트 카드와 페이지 헤더의 유일한 수기 정본.
#
# 본문 정본은 각 저장소의 README 이고, 이 파일은 그 README 를 어느 커밋에서
# 가져올지와 사이트 전용 얇은 헤더에 무엇을 보일지만 소유한다.
#
#   ref       40자리 커밋 SHA 만 허용한다. 브랜치 이름은 결정성이 없어 거부한다.
#   period    git 첫 커밋 ~ 마지막 커밋 날짜. 실제 프로젝트 기간이 따로 있으면 손으로 바꾼다.
#   status    planned | active | completed | archived
#   concepts  정확히 3개. 공개된 위키 문서여야 하며 check-projects 가 검증한다.
#
# 값을 고친 뒤에는 반드시 `npm run sync:projects` 를 다시 실행한다.

